appId: ${APP_ID}
name: Navigate to room action
tags:
  - 'util'

---
- runFlow:
    when:
      notVisible:
        id: 'room-view'
    commands:
      - runFlow:
          file: './search-and-navigate-room.yaml'
          env:
            ROOM: ${ROOM}

- extendedWaitUntil:
    visible:
      id: 'room-view'
    timeout: 60000

- runFlow: './open-room-actions.yaml'
