appId: ${APP_ID}
name: Clear search field
tags:
  - 'util'
---
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          text: 'Clear text'
      - runFlow: 'close-search.yaml'
- runFlow:
    when:
      platform: android
    commands:
      - tapOn:
          id: clear-text-input
