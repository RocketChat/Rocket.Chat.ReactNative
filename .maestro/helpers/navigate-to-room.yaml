appId: ${APP_ID}
name: Navigate to room
tags:
  - 'util'

---
- runFlow: './pop-to-rooms-list.yaml'
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: 'rooms-list-view-item-${ROOM}'
- waitForAnimationToEnd
- tapOn:
    id: 'rooms-list-view-item-${ROOM}'
- runFlow:
    file: 'assert-room-title.yaml'
    env:
      ROOM: ${ROOM}
