appId: ${APP_ID}
name: Go back
tags:
  - 'util'

---
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn:
          id: '(custom-)?header-back'
          retryTapIfNoChange: true

- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          id: 'Back'
          retryTapIfNoChange: true
