appId: ${APP_ID}
name: Go back
tags:
  - 'util'

---
- runFlow:
    when:
      platform: Android
      visible:
        id: 'custom-header-back'
    commands:
      - tapOn:
          id: 'custom-header-back'

- runFlow:
    when:
      platform: Android
      visible:
        id: 'header-back'
    commands:
      - tapOn:
          id: 'header-back'

- runFlow:
    when:
      platform: iOS
    commands:
      # The native stack's back button carries no accessibilityIdentifier, only
      # the "Back" accessibility label (headerBackButtonDisplayMode: 'minimal'
      # hides the title text but keeps that label for VoiceOver/XCUITest).
      - tapOn:
          text: 'Back'
          retryTapIfNoChange: true
