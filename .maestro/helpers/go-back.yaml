appId: ${APP_ID}
name: Go back
tags:
  - 'util'

---
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn:
          id: '(custom-)?header-back'

# iOS system back button: id BackButton, labelled with the previous screen title.
# The unread badge back button has no id, only a 'Back, N Unread' label.
# The selector is chosen once so a tap on the first can't trigger the second on the next screen.
- evalScript: ${output.iosBackById = false}
- runFlow:
    when:
      platform: iOS
      visible:
        id: 'BackButton'
    commands:
      - evalScript: ${output.iosBackById = true}

- runFlow:
    when:
      platform: iOS
      true: ${output.iosBackById}
    commands:
      - tapOn:
          id: 'BackButton'
          retryTapIfNoChange: true

- runFlow:
    when:
      platform: iOS
      true: ${!output.iosBackById}
    commands:
      - tapOn:
          text: 'Back(, .*)?'
          retryTapIfNoChange: true
