appId: ${APP_ID}
name: Open room actions
tags:
  - 'util'

---
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          id: 'room-view-header-more'
          retryTapIfNoChange: true
      - extendedWaitUntil:
          visible:
            id: 'action-sheet-handle'
          timeout: 60000
      - tapOn:
          id: 'room-view-header-room-actions'
- runFlow:
    when:
      platform: Android
    commands:
      - assertVisible:
          id: 'room-header'
          index: 0
      - tapOn:
          id: 'room-header'
          index: 0
          retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: 'room-actions-view'
    timeout: 60000
