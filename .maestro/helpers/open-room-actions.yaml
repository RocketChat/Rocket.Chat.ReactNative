appId: ${APP_ID}
name: Open room actions
tags:
  - 'util'

---
- runFlow:
    when:
      platform: iOS
    commands:
      # The native header's overflow ("More") item carries only a label, no accessibilityIdentifier.
      # It opens a JS action sheet whose "Actions" entry navigates to Room Actions.
      - tapOn:
          text: 'More'
          retryTapIfNoChange: true
      - extendedWaitUntil:
          visible:
            text: 'Actions'
          timeout: 60000
      - tapOn:
          text: 'Actions'
- runFlow:
    when:
      platform: Android
    commands:
      - assertVisible:
          id: 'room-header'
          index: 0
      - tapOn:
          id: 'room-header'
          index: 0
          retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: 'room-actions-view'
    timeout: 60000
