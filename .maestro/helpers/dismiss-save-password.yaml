appId: chat.rocket.reactnative
name: Dismiss iOS Save Password
tags:
  - 'util'

---
# iOS 26 surfaces a system "Save Password?" sheet asynchronously after native
# password form submissions (login, change-password). It overlays the screen
# and blocks XCUITest hit-testing for elements underneath. The sheet
# animates in with variable latency (observed 0.5s–7s after submit), so a
# one-shot `runFlow when: visible:` check from the moment the next view
# becomes visible can fire before the sheet is rendered and miss it.
#
# Wait up to 8s for the sheet to appear, then dismiss. Both waits are
# `optional: true` so the flow is a no-op on iOS versions / runs where the
# sheet never appears. Gated to iOS — Android shows a different autofill
# dialog handled elsewhere.
- runFlow:
    when:
      platform: iOS
    commands:
      - extendedWaitUntil:
          visible: 'Securely store your password'
          timeout: 8000
          optional: true
      - tapOn:
          text: 'Not Now'
          optional: true
