appId: ${APP_ID}
name: Connect Appduct
tags:
  - 'util'
---
- evalScript: ${output.appductLink = output.utils.linkAppduct()}
- repeat:
    times: 8
    while:
      true: ${!output.appductLink.live}
    commands:
      - runFlow:
          when:
            visible: '.*Open in.*'
            platform: iOS
          commands:
            - tapOn:
                text: '^Open$'
                optional: true
      - evalScript: ${output.appductLink = output.utils.waitForAppduct(output.appductLink)}
- assertTrue: ${output.appductLink.live}
