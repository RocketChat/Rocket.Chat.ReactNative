appId: ${APP_ID}
name: Login with Token
tags:
  - 'util'

---
- runFlow: 'reset-app.yaml'
- runFlow: 'appduct-connect.yaml'
- evalScript: ${output.utils.loginWithToken(USERNAME, PASSWORD, server || output.data.server)}
- runFlow:
    when:
      visible: '.*Would like to send you notifications.*'
      platform: iOS
    commands:
      - tapOn: 'Allow'
- runFlow:
    when:
      platform: android
    commands:
      - runFlow:
          when:
            visible: '.*Pixel Launcher.*'
          commands:
            - tapOn: 'Close App'
- retry:
    maxRetries: 3
    commands:
      # Cold-boot emulators can show "System UI isn't responding" over the app
      - runFlow:
          when:
            visible: ".*isn't responding.*"
          commands:
            - tapOn: 'Wait'
      - extendedWaitUntil:
          visible:
            id: 'rooms-list-view'
          timeout: 60000
