appId: ${APP_ID}
name: Open Deep Link
tags:
  - 'util'

---
- openLink:
    link: ${link}
- runFlow:
    when:
      visible: '.*Open in.*'
      platform: iOS
    commands:
      # Anchored regex: the dialog title "Open in 'Rocket.Chat Experimental'?"
      # also matches `Open` as a substring, so an unanchored selector picks the
      # title (cold-launch on iOS 26) instead of the button and leaves the
      # dialog up. ^Open$ targets only the button label.
      - tapOn:
          text: '^Open$'
          optional: true
- runFlow:
    when:
      visible: '.*Would like to send you notifications.*'
      platform: iOS
    commands:
      - tapOn: 'Allow'
