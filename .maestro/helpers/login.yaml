appId: ${APP_ID}
name: Login
tags:
  - 'util'
onFlowStart:
  - runFlow:
      file: setup.yaml
      env:
        skipUser: true
  - runFlow:
      when:
        true: ${!USERNAME}
      commands:
        - evalScript: ${output.createdUser = output.utils.createUser()}

---
- runFlow: navigate-to-login.yaml
- tapOn:
    id: login-view-email
- inputText: ${USERNAME || output.createdUser.email}
- tapOn:
    text: '.*Username or email.*'
- pressKey: enter
- tapOn:
    id: login-view-password
- inputText: ${PASSWORD || output.createdUser.password}
- tapOn:
    text: Login
    index: 0
- tapOn:
    id: login-view-submit
- extendedWaitUntil:
    visible:
      id: rooms-list-view
    timeout: 60000
# iOS 26 surfaces a system "Save Password?" prompt after a successful login
# submit. It overlays the rooms list and blocks XCUITest hit-testing for
# elements underneath, so subsequent `enabled: true` assertions never resolve.
- runFlow:
    when:
      platform: iOS
      visible: 'Not Now'
    commands:
      - tapOn: 'Not Now'
