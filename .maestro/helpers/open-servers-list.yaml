appId: ${APP_ID}
name: Open servers list
tags:
  - 'util'

---
- extendedWaitUntil:
    visible:
      id: 'rooms-list-header-servers-list-button'
    timeout: 60000
- repeat:
    times: 3
    while:
      notVisible:
        id: 'rooms-list-header-servers-list'
    commands:
      - tapOn:
          id: 'rooms-list-header-servers-list-button'
      - extendedWaitUntil:
          visible:
            id: 'rooms-list-header-servers-list'
          timeout: 5000
          optional: true
