appId: ${APP_ID}
name: Open servers list
tags:
  - 'util'

---
- runFlow:
    when:
      platform: iOS
    commands:
      - extendedWaitUntil:
          visible:
            text: 'Menu'
          timeout: 60000
      - tapOn:
          text: '(?!\d{1,2}:\d{2}).+'
          rightOf:
            text: 'Menu'
          leftOf:
            text: 'Create new channel.*'
          index: 0

- runFlow:
    when:
      platform: Android
    commands:
      - extendedWaitUntil:
          visible:
            id: 'rooms-list-header-servers-list-button'
          timeout: 60000
      - tapOn:
          id: 'rooms-list-header-servers-list-button'
