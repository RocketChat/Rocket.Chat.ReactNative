appId: ${APP_ID}
name: Search Member
onFlowStart:
  - runFlow: '../../helpers/setup.yaml'
onFlowComplete:
  - evalScript: ${output.utils.deleteCreatedUsers()}
tags:
  - test-13

---
- evalScript: ${output.user = output.utils.createUser()}

- runFlow:
    file: '../../helpers/login-with-deeplink.yaml'
    env:
      USERNAME: ${output.user.username}
      PASSWORD: ${output.user.password}

- runFlow:
    file: '../../helpers/navigate-to-room.yaml'
    env:
      ROOM: 'general'
- runFlow: '../../helpers/open-room-actions.yaml'
- tapOn:
    id: 'room-actions-members'

# should search in all users
- runFlow:
    file: '../../helpers/tap-search-field.yaml'
    env:
      SEARCH_ID: 'room-members-view-search'
- inputText: rohit.bansal
- extendedWaitUntil:
    visible:
      id: 'room-members-view-item-rohit.bansal'
    timeout: 60000

# use online status and it should use the text filter
- runFlow:
    file: '../../helpers/select-header-filter.yaml'
    env:
      ANDROID_FILTER_ID: 'room-members-view-filter'
      ANDROID_OPTION_ID: 'room-members-view-toggle-status-online'
      IOS_OPTION: 'Online'
- extendedWaitUntil:
    visible:
      text: 'No members found'
    timeout: 60000

# use all status again and it should use text filter
- runFlow:
    file: '../../helpers/select-header-filter.yaml'
    env:
      ANDROID_FILTER_ID: 'room-members-view-filter'
      ANDROID_OPTION_ID: 'room-members-view-toggle-status-all'
      IOS_OPTION: 'All'
- extendedWaitUntil:
    visible:
      id: 'room-members-view-item-rohit.bansal'
    timeout: 60000
- runFlow: '../../helpers/clear-search-field.yaml'

- evalScript: ${output.secondUser = output.utils.createUser()}

# should search for new user in all list
- runFlow:
    file: '../../helpers/tap-search-field.yaml'
    env:
      SEARCH_ID: 'room-members-view-search'
- inputText: ${output.secondUser.username}
- extendedWaitUntil:
    visible:
      id: 'room-members-view-item-${output.secondUser.username}'
    timeout: 60000

# Verify "No members found" message appears correctly when search returns no results
- runFlow:
    file: '../../helpers/tap-search-field.yaml'
    env:
      SEARCH_ID: 'room-members-view-search'
- inputText: nonexistentuser12345
- extendedWaitUntil:
    visible:
      text: 'No members found'
    timeout: 60000
