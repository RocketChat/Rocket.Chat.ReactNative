appId: ${APP_ID}
name: Open room with last message as thread with more than 50 messages
onFlowStart:
  - runFlow: '../../helpers/setup.yaml'
tags:
  - test-12

---
- runFlow:
    file: '../../helpers/login-with-deeplink.yaml'
    env:
      USERNAME: ${output.account.adminUser}
      PASSWORD: ${output.account.adminPassword}

# should open a room where the last message is a thread containing more than 50 messages.
- runFlow:
    file: '../../helpers/navigate-to-room.yaml'
    env:
      ROOM: 'maestro_test_load_threads'
- extendedWaitUntil:
    visible:
      text: '.*message 50.*'
    timeout: 60000
- extendedWaitUntil:
    visible:
      id: 'thread-count-55'
    timeout: 60000
# Regression target (PR #6680 / NATIVE-1035): the initial load must gather 50 main messages
# despite 55 thread replies polluting the batch. If the loop in loadMessagesForRoom.ts is
# broken, message 1 won't be in memory and the assertVisible below will fail.
#
# 12 full-page scrolls is a deterministic, fixed-cost burn through the FlashList; each
# `scroll` is one page (~5-7 rows), so 12 covers 50 rows with cushion. Faster on slow
# emulators than scrollUntilVisible's polling micro-scrolls.
- repeat:
    times: 12
    commands:
      - scroll
      - waitForAnimationToEnd
- assertVisible:
    id: 'message-content-message 1'
