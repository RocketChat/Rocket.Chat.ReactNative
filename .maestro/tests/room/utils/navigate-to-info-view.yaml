appId: ${APP_ID}
name: Navigate to info view
tags:
  - 'util'

---
- extendedWaitUntil:
    visible:
      id: 'room-view-title-.*'
    timeout: 60000
- tapOn:
    id: 'room-view-title-.*'
- extendedWaitUntil:
    visible:
      id: room-actions-view
    timeout: 60000
- assertVisible:
    id: room-actions-info
- tapOn:
    id: room-actions-info
- extendedWaitUntil:
    visible:
      id: room-info-view
    timeout: 60000
