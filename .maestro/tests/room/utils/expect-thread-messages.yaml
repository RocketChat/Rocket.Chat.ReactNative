appId: ${APP_ID}
name: Expect Thread Messages
tags:
  - 'util'

---
- runFlow:
    file: '../../../helpers/assert-room-title.yaml'
    env:
      ROOM: 'thread 1'
- extendedWaitUntil:
    visible:
      id: '.*message-content-${message}.*'
    timeout: 60000
- tapOn:
    id: '.*message-content-${message}.*'
