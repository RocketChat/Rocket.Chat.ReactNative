appId: ${APP_ID}
name: Open Reaction Picker
tags:
  - 'util'

---
- evalScript: ${output.reactionPickerAttempt = 0}
- retry:
    maxRetries: 2
    commands:
      - evalScript: ${output.reactionPickerAttempt = output.reactionPickerAttempt + 1}
      - runFlow:
          when:
            true: ${output.reactionPickerAttempt > 1}
          commands:
            - tapOn:
                point: 50%,20%
            - waitForAnimationToEnd
      - extendedWaitUntil:
          visible:
            text: .*${MESSAGE}.*
          timeout: 60000
      - longPressOn:
          id: 'message-content-${MESSAGE}'
      - waitForAnimationToEnd
      - extendedWaitUntil:
          visible:
            id: action-sheet
          timeout: 60000
      - extendedWaitUntil:
          visible:
            id: add-reaction
          timeout: 60000
      - tapOn:
          id: add-reaction
      - extendedWaitUntil:
          visible:
            id: ${EXPECTED_ID}
          timeout: 15000
