appId: ${APP_ID}
name: Open a stored room offline and send a message
onFlowStart:
  - runFlow: '../../helpers/setup.yaml'
onFlowComplete:
  - setAirplaneMode: disabled
  - stopApp: ${APP_ID}
  - evalScript: ${output.utils.deleteCreatedUsers()}
tags:
  - test-3
  - android-only

---
- evalScript: ${output.user = output.utils.createUser()}
- evalScript: ${output.sender = output.utils.createUser()}
- evalScript: ${output.tag = 'offline-send-' + output.random(6)}
- evalScript: ${output.utils.sendMessage(output.sender.username, output.sender.password, '@' + output.user.username, output.tag + '-stored')}

- runFlow:
    file: '../../helpers/login-with-deeplink.yaml'
    env:
      USERNAME: ${output.user.username}
      PASSWORD: ${output.user.password}
      CLEAR_STATE: true
- runFlow:
    file: '../../helpers/navigate-to-room.yaml'
    env:
      ROOM: ${output.sender.username}
- extendedWaitUntil:
    visible:
      id: 'message-content-${output.tag}-stored'
    timeout: 60000

# should open the room offline and show its stored messages
- stopApp: ${APP_ID}
- setAirplaneMode: enabled
- launchApp:
    appId: ${APP_ID}
    clearState: false
- extendedWaitUntil:
    visible:
      id: 'rooms-list-view'
    timeout: 60000
- runFlow:
    file: '../../helpers/navigate-to-room.yaml'
    env:
      ROOM: ${output.sender.username}
- extendedWaitUntil:
    visible:
      id: 'message-content-${output.tag}-stored'
    timeout: 60000

# should render the unsent message with an error indicator
- extendedWaitUntil:
    visible:
      id: 'message-composer-input'
    timeout: 60000
- waitForAnimationToEnd
- tapOn:
    id: 'message-composer-input'
- runFlow:
    file: '../../helpers/send-message.yaml'
    env:
      message: ${output.tag + '-unsent'}
      isThread: false
- extendedWaitUntil:
    visible:
      id: 'message-error-${output.tag}-unsent'
    timeout: 60000
- assertVisible:
    id: 'message-content-${output.tag}-stored'
