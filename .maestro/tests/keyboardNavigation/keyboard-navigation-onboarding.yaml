appId: ${APP_ID}
name: Keyboard Navigation Onboarding
onFlowStart:
  - runFlow: '../../helpers/setup.yaml'
onFlowComplete:
  - evalScript: ${output.utils.deleteCreatedUsers()}
tags:
  - test-14
  - android-only

---
- evalScript: ${output.user = output.utils.createUser()}
- evalScript: ${output.keyboardMessage = 'keyboard-nav-' + output.random(6)}

- runFlow: ../../helpers/launch-app.yaml

# login from onboarding/NewServerView
- extendedWaitUntil:
    visible:
      id: 'new-server-view'
    timeout: 60000
- inputText: ${output.data.server}
- pressKey: tab
- pressKey: enter
- extendedWaitUntil:
    visible: 'Login'
    timeout: 60000
- pressKey: enter

- extendedWaitUntil:
    visible:
      id: 'login-view'
    timeout: 60000
- repeat:
    times: 10
    while:
      notVisible:
        id: 'login-view-email'
        focused: true
    commands:
      - pressKey: Remote Dpad Down
      - waitForAnimationToEnd:
          timeout: 1000
- assertVisible:
    id: 'login-view-email'
    focused: true
- inputText: ${output.user.email}
- pressKey: enter
- repeat:
    times: 10
    while:
      notVisible:
        id: 'login-view-password'
        focused: true
    commands:
      - pressKey: Remote Dpad Down
      - waitForAnimationToEnd:
          timeout: 1000
- assertVisible:
    id: 'login-view-password'
    focused: true
- inputText: ${output.user.password}
- hideKeyboard
- repeat:
    times: 10
    while:
      notVisible:
        id: 'login-view-submit'
        focused: true
    commands:
      - pressKey: Remote Dpad Down
      - waitForAnimationToEnd:
          timeout: 1000
- assertVisible:
    id: 'login-view-submit'
    focused: true
- pressKey: enter
- extendedWaitUntil:
    visible:
      id: 'rooms-list-view'
    timeout: 60000
#
