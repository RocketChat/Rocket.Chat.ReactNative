appId: ${APP_ID}
name: Keyboard Navigation Components
onFlowStart:
  - runFlow: '../../helpers/setup.yaml'
onFlowComplete:
  - evalScript: ${output.utils.deleteCreatedUsers()}
tags:
  - test-14
  - android-only

---
- evalScript: ${output.user = output.utils.createUser()}

- runFlow:
    file: '../../helpers/login-with-deeplink.yaml'
    env:
      USERNAME: ${output.user.username}
      PASSWORD: ${output.user.password}

# open Accessibility & appearance
- extendedWaitUntil:
    visible:
      text: 'Save your encryption password'
    timeout: 60000
- pressKey: enter
- extendedWaitUntil:
    visible:
      text: 'Accessibility & Appearance'
    timeout: 60000
- repeat:
    times: 10
    while:
      notVisible:
        focused: true
        containsDescendants:
          - id: 'sidebar-accessibility'
    commands:
      - pressKey: Remote Dpad Down
      - waitForAnimationToEnd:
          timeout: 1000
- assertVisible:
    focused: true
    containsDescendants:
      - id: 'sidebar-accessibility'
- pressKey: enter

# switches
- extendedWaitUntil:
    visible:
      id: 'accessibility-view-list'
    timeout: 60000
- assertVisible:
    text: 'Mentions with @ symbol unchecked'
- repeat:
    times: 10
    while:
      notVisible:
        focused: true
        containsDescendants:
          - text: 'Show alerts as\. Toasts'
    commands:
      - pressKey: Remote Dpad Down
      - waitForAnimationToEnd:
          timeout: 1000
- assertVisible:
    focused: true
    containsDescendants:
      - text: 'Show alerts as\. Toasts'
- repeat:
    times: 10
    while:
      notVisible:
        focused: true
        containsDescendants:
          - id: 'accessibility-mentions-with-at-symbol-switch'
    commands:
      - pressKey: Remote Dpad Up
      - waitForAnimationToEnd:
          timeout: 1000
- assertVisible:
    focused: true
    containsDescendants:
      - id: 'accessibility-mentions-with-at-symbol-switch'
- pressKey: enter
- assertVisible:
    text: 'Mentions with @ symbol checked'

# open Theme and navigate radio buttons
- repeat:
    times: 10
    while:
      notVisible:
        focused: true
        containsDescendants:
          - id: 'accessibility-theme-button'
    commands:
      - pressKey: Remote Dpad Up
      - waitForAnimationToEnd:
          timeout: 1000
- assertVisible:
    focused: true
    containsDescendants:
      - id: 'accessibility-theme-button'
- pressKey: enter
- extendedWaitUntil:
    visible:
      id: 'theme-view'
    timeout: 60000
- repeat:
    times: 10
    while:
      notVisible:
        focused: true
        containsDescendants:
          - id: 'theme-view-light'
    commands:
      - pressKey: Remote Dpad Down
      - waitForAnimationToEnd:
          timeout: 1000
- assertVisible:
    focused: true
    containsDescendants:
      - id: 'theme-view-light'
- pressKey: enter
- repeat:
    times: 10
    while:
      notVisible:
        focused: true
        containsDescendants:
          - id: 'theme-view-automatic'
    commands:
      - pressKey: Remote Dpad Up
      - waitForAnimationToEnd:
          timeout: 1000
- assertVisible:
    focused: true
    containsDescendants:
      - id: 'theme-view-automatic'
- pressKey: enter

# open Toasts and Dialogs action sheet and navigate through options
- runFlow: '../../helpers/go-back.yaml'
- extendedWaitUntil:
    visible:
      id: 'accessibility-view-list'
    timeout: 60000
- assertVisible: Show alerts as
- repeat:
    times: 10
    while:
      notVisible:
        focused: true
        containsDescendants:
          - text: 'Show alerts as\. Toasts'
    commands:
      - pressKey: Remote Dpad Down
      - waitForAnimationToEnd:
          timeout: 1000
- assertVisible:
    focused: true
    containsDescendants:
      - text: 'Show alerts as\. Toasts'
- pressKey: enter
- waitForAnimationToEnd:
    timeout: 1000
- assertVisible: 'Toasts. Dismissed automatically. Checked'
- assertVisible: 'Dialogs. Require manual dismissal. Unchecked'
- repeat:
    times: 10
    while:
      notVisible:
        focused: true
        containsDescendants:
          - text: 'Dialogs\. Require manual dismissal\. Unchecked'
    commands:
      - pressKey: Remote Dpad Down
      - waitForAnimationToEnd:
          timeout: 1000
- assertVisible:
    focused: true
    containsDescendants:
      - text: 'Dialogs\. Require manual dismissal\. Unchecked'
- pressKey: enter
- waitForAnimationToEnd:
    timeout: 1000
- assertVisible: Dialogs
- assertVisible: Show alerts as
- repeat:
    times: 10
    while:
      notVisible:
        focused: true
        containsDescendants:
          - text: 'Show alerts as\. Dialogs'
    commands:
      - pressKey: Remote Dpad Down
      - waitForAnimationToEnd:
          timeout: 1000
- assertVisible:
    focused: true
    containsDescendants:
      - text: 'Show alerts as\. Dialogs'
- pressKey: enter
- waitForAnimationToEnd:
    timeout: 1000
- assertVisible: 'Toasts. Dismissed automatically. Unchecked'
- assertVisible: 'Dialogs. Require manual dismissal. Checked'
- repeat:
    times: 10
    while:
      notVisible:
        focused: true
        containsDescendants:
          - text: 'Toasts\. Dismissed automatically\. Unchecked'
    commands:
      - pressKey: Remote Dpad Up
      - waitForAnimationToEnd:
          timeout: 1000
- assertVisible:
    focused: true
    containsDescendants:
      - text: 'Toasts\. Dismissed automatically\. Unchecked'
- pressKey: enter
- waitForAnimationToEnd:
    timeout: 1000
- assertVisible: Toasts
- assertVisible: Show alerts as
