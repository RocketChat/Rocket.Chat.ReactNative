appId: ${APP_ID}
name: Check Server
tags:
  - 'util'

---
- extendedWaitUntil:
    visible:
      id: 'rooms-list-view'
    timeout: 60000
- tapOn:
    id: 'tab-menu'
- extendedWaitUntil:
    visible:
      id: 'sidebar-view'
    timeout: 60000
- extendedWaitUntil:
    visible:
      text: '.*Connected to ${server}.*'
    timeout: 60000
- extendedWaitUntil:
    visible:
      id: 'sidebar-user-info'
    timeout: 60000
- tapOn:
    id: 'tab-chats'
- extendedWaitUntil:
    visible:
      id: 'rooms-list-view'
    timeout: 60000
