appId: ${APP_ID}
name: Go To Room List
tags:
  - 'util'

---
- waitForAnimationToEnd:
    timeout: 10000
- runFlow: '../../../helpers/go-back.yaml'
- runFlow:
    file: '../../../helpers/wait-header-item.yaml'
    env:
      ANDROID_ID: 'accessibility-view-drawer'
      IOS_LABEL: 'Menu'
- runFlow:
    file: '../../../helpers/tap-header-item.yaml'
    env:
      ANDROID_ID: 'accessibility-view-drawer'
      IOS_LABEL: 'Menu'
- extendedWaitUntil:
    visible:
      id: 'sidebar-chats'
    timeout: 60000
- tapOn:
    id: 'sidebar-chats'
