appId: ${APP_ID}
name: Go To Room List
tags:
  - 'util'

---
- waitForAnimationToEnd:
    timeout: 10000
- runFlow: '../../../helpers/go-back.yaml'
- extendedWaitUntil:
    visible:
      id: 'accessibility-view-drawer'
    timeout: 60000
- tapOn:
    id: 'accessibility-view-drawer'
- extendedWaitUntil:
    visible:
      id: 'sidebar-chats'
    timeout: 60000
- tapOn:
    id: 'sidebar-chats'
