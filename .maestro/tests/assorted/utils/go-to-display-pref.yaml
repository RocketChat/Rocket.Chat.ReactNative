appId: ${APP_ID}
name: Go To Display Pref
tags:
  - 'util'

---
- tapOn:
    id: 'tab-menu'
- extendedWaitUntil:
    visible:
      id: 'sidebar-accessibility'
    timeout: 60000
- tapOn:
    id: 'sidebar-accessibility'
- waitForAnimationToEnd:
    timeout: 60000
- extendedWaitUntil:
    visible:
      id: 'accessibility-display-button'
    timeout: 60000
- tapOn:
    id: 'accessibility-display-button'
