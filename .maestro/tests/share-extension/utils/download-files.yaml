appId: ${APP_ID}
name: Download File
tags:
  - 'util'

---
- runFlow:
    when:
      platform: android
    commands:
      - clearState: com.android.chrome
      - launchApp: com.android.chrome
# On Android, chrome may ask to add account to the device
- runFlow:
    when:
      visible: '.*Add account to device.*'
      platform: Android
    commands:
      - tapOn:
          text: 'Use without an account'
          optional: true
- runFlow:
    when:
      visible: '.*Chrome notifications make things easier.*'
      platform: Android
    commands:
      - tapOn: 'No thanks'

- runFlow:
    when:
      platform: ios
    commands:
      - launchApp: com.apple.mobilesafari

- runFlow:
