appId: ${APP_ID}
name: Download File
tags:
  - 'util'

---

- runFlow:
    when:
      platform: android
    commands:
      - clearState: com.android.chrome
      - launchApp: com.android.chrome
      - extendedWaitUntil:
          visible: 'Add account to device'
          timeout: 60000
      - tapOn: 'Stay signed out'

- runFlow:
    when:
      platform: ios
    commands:
      - launchApp: com.apple.mobilesafari

# on ios, downloading pdf seems kinda hard
- runFlow:
    when:
      platform: android
    commands:
      - runFlow:
          file: 'download-file.yaml'
          env:
            file: 'XJR2sjYfSAMz5eyT2/test.pdf'

