appId: ${APP_ID}
name: Share File
tags:
  - 'util'

---
- runFlow:
    when:
      platform: android
    commands:
      - pressKey: home
      - launchApp: com.google.android.documentsui
      - extendedWaitUntil:
          visible: 'Files in Downloads'
          timeout: 60000
      - scrollUntilVisible:
          element:
            text: ${fileName}
          timeout: 60000
      - longPressOn: ${fileName}
      - tapOn: 'Share'
      - tapOn: 'Rocket.Chat'

- runFlow:
    when:
      platform: iOS
    commands:
      - extendedWaitUntil:
          visible: 'Share'
          timeout: 10000
      - tapOn: 'Share'
      - tapOn: 'Rocket.Chat'

- extendedWaitUntil:
    visible: 'Chats'
    timeout: 10000
- extendedWaitUntil:
    visible:
      id: 'share-extension-item-${output.room.name}'
    timeout: 10000
- tapOn:
    id: 'share-extension-item-${output.room.name}'
- extendedWaitUntil:
    visible: 'Sending to ${output.room.name}'
    timeout: 10000
- tapOn:
    id: 'message-composer-send'
- extendedWaitUntil:
    visible:
      id: 'rooms-list-view'
    timeout: 60000
- evalScript: ${output.newMessageCount = output.utils.roomMessageCount(output.user.username, output.user.password, output.room._id)}
- assertTrue:
    condition: ${output.newMessageCount === output.messageCount + 1}
- evalScript: ${output.messageCount = output.newMessageCount}
