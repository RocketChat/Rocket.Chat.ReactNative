executionPrerequisite: 'iPhone 16 Pro sim (UDID
  DCDEBDE5-D487-4115-B93C-2B30CD482C49) booted; app chat.rocket.ios running,
  RCT_jsLocation pinned to 127.0.0.1:8083 (this worktree''s Metro — verify with
  `defaults read chat.rocket.ios RCT_jsLocation`); logged in as diego.mello2
  (display "Diego Mello") on open.rocket.chat; rooms list visible (E2EE banner
  "Digite a senha E2EE" above it) and — VERIFY WITH describe EVERY RUN — the
  "Diego Mello" DM row at frame (0, 0.261, 1, 0.086), i.e. row 2 below
  react-native-notifications. The list reorders by last activity and WILL drift:
  react-native-notifications receives Rocket.Cat webhook posts every few minutes,
  and this flow''s own send bumps the DM to row 1 (frame 0, 0.175, 1, 0.086). If
  the frame differs, edit the first gesture-tap step''s y to the row''s current
  center before running; the DM''s composer draft is
  empty; sim keyboard autocorrection AND autocapitalization disabled (`xcrun simctl
  spawn <UDID> defaults write com.apple.Preferences KeyboardAutocorrection -bool
  false` + same for KeyboardAutocapitalization, then restart the app) — otherwise
  autocorrect rewrites the payload (observed: perf → Please); the prediction bar
  stays ON (turning it off shrinks the keyboard and shifts the send button''s y).
  For profiling runs: do a
  fresh Metro reload (port 8083), let the app settle to idle on the rooms list,
  THEN start the profiler, THEN run this flow — reload must NOT happen after
  profiler attach.'
steps:
  - echo: 'On rooms list — tapping "Diego Mello" DM row (frame 0,0.261,1,0.086 per
      prerequisite check; baseline commit #5 cold room open starts here)'
  - tool: gesture-tap
    args:
      udid: DCDEBDE5-D487-4115-B93C-2B30CD482C49
      x: 0.5
      y: 0.304
  - echo: In "Diego Mello" DM at bottom — settling to idle 20s (pre-send baseline;
      covers the finding-4 background-burst window ~16-18s after room open)
  - tool: screenshot
    args:
      udid: DCDEBDE5-D487-4115-B93C-2B30CD482C49
    delayMs: 20000
  - echo: Focusing composer "Message @Diego Mello" (frame 0.129,0.906,0.741,0.055)
  - tool: gesture-tap
    args:
      udid: DCDEBDE5-D487-4115-B93C-2B30CD482C49
      x: 0.5
      y: 0.934
  - echo: Typing payload perf-profile-7126 (same text as baseline so the parse-cache
      key is comparable)
  - tool: keyboard
    args:
      udid: DCDEBDE5-D487-4115-B93C-2B30CD482C49
      text: perf-profile-7126
    delayMs: 1000
  - echo: Tapping Send "Enviar mensagem" (frame 0.900,0.564,0.060,0.027 with
      keyboard open; mic button swaps to send once text present) — starts the
      re-profile window's send event
  - tool: gesture-tap
    args:
      udid: DCDEBDE5-D487-4115-B93C-2B30CD482C49
      x: 0.93
      y: 0.578
    delayMs: 1000
  - echo: 'Sent — waiting 2s then screenshot (re-profile window tail: baseline hot
      commits land +0.5s and +1.7s after send; expect own message
      "Perf-profile-7126" at DM bottom — sim autocap uppercases the P,
      deterministic)'
  - tool: screenshot
    args:
      udid: DCDEBDE5-D487-4115-B93C-2B30CD482C49
    delayMs: 2000
