executionPrerequisite: RoomsList visible, logged in as diego.mello2 on
  open.rocket.chat, message-variations-tester row at ~y=0.27
steps:
  - tool: gesture-tap
    args:
      udid: emulator-5554
      x: 0.5
      y: 0.274
  - tool: await-ui-element
    args:
      udid: emulator-5554
      condition: visible
      selector:
        identifier: room-view-messages
      timeoutMs: 12000
  - tool: gesture-tap
    args:
      udid: emulator-5554
      x: 0.053
      y: 0.071
    delayMs: 2500
  - tool: await-ui-element
    args:
      udid: emulator-5554
      condition: visible
      selector:
        identifier: rooms-list-view-search
      timeoutMs: 12000
      delayMs: 1500
