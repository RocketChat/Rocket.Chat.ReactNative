name: Setup Node
description: Setup node and pnpm via corepack, restoring node_modules from cache and installing only on a miss
inputs:
  node-version:
    description: Node version to use instead of the one pinned in package.json, such as a major the runner image already has
    required: false
    default: ''
runs:
  using: "composite"
  steps:
    - name: Enable corepack
      shell: bash
      run: corepack enable

    - name: Restore node_modules
      id: node-modules
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      env:
        SEGMENT_DOWNLOAD_TIMEOUT_MINS: 4
      with:
        path: node_modules
        key: node-modules-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', 'package.json', 'patches/**') }}

    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      env:
        SEGMENT_DOWNLOAD_TIMEOUT_MINS: 4
      with:
        node-version: ${{ inputs.node-version }}
        node-version-file: ${{ inputs.node-version == '' && 'package.json' || '' }}
        cache: ${{ steps.node-modules.outputs.cache-hit != 'true' && 'pnpm' || '' }}

    - name: Install JS dependencies
      if: steps.node-modules.outputs.cache-hit != 'true'
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Save node_modules
      if: steps.node-modules.outputs.cache-hit != 'true'
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: node_modules
        key: ${{ steps.node-modules.outputs.cache-primary-key }}
