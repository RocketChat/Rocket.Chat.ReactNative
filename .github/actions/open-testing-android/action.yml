name: 'Open Testing Android'
description: 'Promotes the uploaded build from the internal track to open testing'
inputs:
  FASTLANE_GOOGLE_SERVICE_ACCOUNT:
    description: 'Google service account key for upload'
    required: true
  BUILD_VERSION:
    description: 'Version code of the build to promote'
    required: true

runs:
  using: "composite"
  steps:
    - name: Set up Ruby and Bundler
      uses: ruby/setup-ruby@7372622e62b60b3cb750dcd2b9e32c247ffec26a # v1.302.0
      with:
        ruby-version: 2.7.7
        bundler-cache: true
        working-directory: android

    - name: Store the Google service account key
      working-directory: android
      run: |
        echo "${{ inputs.FASTLANE_GOOGLE_SERVICE_ACCOUNT }}" | base64 --decode > service_account.json
      shell: bash

    - name: Fastlane Promote to Open Testing
      working-directory: android
      run: bundle exec fastlane android open_testing
      env:
        BUILD_VERSION: ${{ inputs.BUILD_VERSION }}
      shell: bash
