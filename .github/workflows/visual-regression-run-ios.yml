name: Visual Regression Run iOS

# Reusable: runs one iOS visual-regression leg against a pre-built Owl app.
# Downloads the app artifact, points owl at the requested simulator, syncs the
# matching baseline prints from the reference repo, then compares.

on:
  workflow_call:
    inputs:
      variant:
        description: 'OWL_VARIANT, e.g. iphone16pro-portrait'
        required: true
        type: string
      device:
        description: 'Simulator name, e.g. iPhone 16 Pro'
        required: true
        type: string
      update_baseline:
        description: 'Capture fresh baselines instead of comparing'
        required: false
        type: boolean
        default: false

jobs:
  run:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      USE_OWL: true
      RUNNING_E2E_TESTS: true
      OWL_VARIANT: ${{ inputs.variant }}
      OWL_DEVICE: ${{ inputs.device }}
      BASELINE_REPO: https://github.com/OtavioStasiak/Rocket.Chat.ReactNative.VisualRegressionTest

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Checkout and Setup Node
        uses: ./.github/actions/setup-node

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: '26.2.0'

      # owl test installs <cwd>/ios/build/Build/Products/Release-iphonesimulator/RocketChat.app
      - name: Download Owl iOS app
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: owl-app-ios
          path: ios/build/Build/Products/Release-iphonesimulator/RocketChat.app

      - name: Point Owl at the target simulator
        run: |
          node -e "const fs=require('fs');const f='owl.config.json';const c=JSON.parse(fs.readFileSync(f,'utf8'));c.ios.device=process.env.OWL_DEVICE;fs.writeFileSync(f,JSON.stringify(c,null,'\t')+'\n')"
          echo "owl.config.json ios.device -> $OWL_DEVICE"

      # The runner doesn't pre-create named simulators for the freshly selected
      # Xcode, so "iPhone 16 Pro" / "iPhone SE (3rd generation)" may not exist
      # yet (simctl: "Invalid device"). Resolve the device by name, creating it
      # on the latest available iOS runtime if missing, then boot by UDID. owl
      # then installs by name onto the one booted device.
      - name: Ensure & boot simulator
        run: |
          set -euo pipefail
          UDID="$(node <<'NODE'
          const { execSync } = require('child_process');
          const name = process.env.OWL_DEVICE;
          const j = c => JSON.parse(execSync(c).toString());
          const devices = j('xcrun simctl list devices available -j').devices;
          let udid;
          for (const rt of Object.keys(devices))
            for (const d of devices[rt]) if (d.name === name) udid = d.udid;
          if (!udid) {
            const dt = j('xcrun simctl list devicetypes -j').devicetypes.find(t => t.name === name);
            if (!dt) { console.error('No simulator device type named: ' + name); process.exit(1); }
            const rts = j('xcrun simctl list runtimes -j').runtimes.filter(r => r.platform === 'iOS' && r.isAvailable);
            if (!rts.length) { console.error('No available iOS runtime'); process.exit(1); }
            const rt = rts[rts.length - 1];
            console.error(`Creating "${name}" on ${rt.name}`);
            udid = execSync(`xcrun simctl create ${JSON.stringify(name)} ${dt.identifier} ${rt.identifier}`).toString().trim();
          }
          process.stdout.write(udid);
          NODE
          )"
          echo "Using simulator $OWL_DEVICE ($UDID)"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl spawn "$UDID" defaults write -g UIAnimationDragCoefficient -float 10

      - name: Sync baseline prints from reference repo (compare mode)
        if: ${{ !inputs.update_baseline }}
        run: |
          set -euo pipefail
          git clone --depth=1 --quiet "$BASELINE_REPO" .owl/reference
          rm -rf .owl/baseline/ios
          mkdir -p .owl/baseline/ios
          cp .owl/reference/app/containers/ActionSheet/"$OWL_VARIANT"-*.png .owl/baseline/ios/
          echo "Staged $(ls .owl/baseline/ios | wc -l) baseline print(s) for $OWL_VARIANT"

      - name: Compare against baselines
        if: ${{ !inputs.update_baseline }}
        run: pnpm owl:test:ios

      - name: Capture fresh baselines
        if: ${{ inputs.update_baseline }}
        run: pnpm owl:test:update:ios

      - name: Upload Owl results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: owl-ios-${{ inputs.variant }}
          path: |
            .owl/report
            .owl/diff
            .owl/latest
            .owl/baseline/ios
          retention-days: 7
