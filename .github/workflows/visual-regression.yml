name: Visual Regression

# Orchestrates the action-sheet visual-regression flow across all device legs,
# mirroring the e2e build->run shape: build each platform's Owl app once, then
# fan out the comparison over devices/orientations. Baselines are pulled from the
# reference repo (OtavioStasiak/Rocket.Chat.ReactNative.VisualRegressionTest) at
# run time — nothing baseline-related is committed in this repo.
#
# Legs: iPhone 16 Pro, iPhone SE (3rd gen, low-height), Android portrait + landscape.

on:
  workflow_dispatch:
    inputs:
      update_baseline:
        description: 'Capture fresh baselines instead of comparing against the reference repo'
        required: false
        type: boolean
        default: false
  pull_request:
    paths:
      - '.github/workflows/visual-regression*.yml'
      - 'app/owls/**'
      - 'tests/owl/**'
      - 'scripts/owl-compare.sh'
      - 'owl.config.json'
      - 'index.js'
      - 'package.json'
      - 'pnpm-lock.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    name: Build iOS
    if: ${{ github.repository == 'RocketChat/Rocket.Chat.ReactNative' }}
    uses: ./.github/workflows/visual-regression-build-ios.yml

  run-ios:
    name: Run iOS (${{ matrix.variant }})
    if: ${{ github.repository == 'RocketChat/Rocket.Chat.ReactNative' }}
    needs: [build-ios]
    uses: ./.github/workflows/visual-regression-run-ios.yml
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: iphone16pro-portrait
            device: iPhone 16 Pro
          - variant: iphonese-portrait
            device: iPhone SE (3rd generation)
    with:
      variant: ${{ matrix.variant }}
      device: ${{ matrix.device }}
      update_baseline: ${{ github.event_name == 'workflow_dispatch' && inputs.update_baseline || false }}

  build-android:
    name: Build Android
    if: ${{ github.repository == 'RocketChat/Rocket.Chat.ReactNative' }}
    uses: ./.github/workflows/visual-regression-build-android.yml

  run-android:
    name: Run Android (${{ matrix.variant }})
    if: ${{ github.repository == 'RocketChat/Rocket.Chat.ReactNative' }}
    needs: [build-android]
    uses: ./.github/workflows/visual-regression-run-android.yml
    strategy:
      fail-fast: false
      matrix:
        variant: [android-portrait, android-landscape]
    with:
      variant: ${{ matrix.variant }}
      update_baseline: ${{ github.event_name == 'workflow_dispatch' && inputs.update_baseline || false }}
