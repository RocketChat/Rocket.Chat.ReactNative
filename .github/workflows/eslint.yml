name: Run Lint and Test

on:
  workflow_call:

permissions: {}

jobs:
  run-eslint-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Checkout and Setup Node
        uses: ./.github/actions/setup-node

      - name: Run Oxlint
        run: pnpm exec oxlint

      - name: Run TypeScript
        run: pnpm exec tsc

      - name: Run Tests
        run: pnpm test

      - name: Validate sniffler test-map freshness
        run: node .github/scripts/validate-test-map.js
