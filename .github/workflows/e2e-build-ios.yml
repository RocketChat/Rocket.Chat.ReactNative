name: E2E Build iOS

on:
  workflow_call:
    secrets:
      BUGSNAG_KEY:
        required: true
    inputs:
      seed-only:
        description: Build only to save a native build under a new fingerprint; no app artifact
        type: boolean
        default: false

permissions: {}

env:
  RUNNING_E2E_TESTS: true
  APPDUCT_ENABLED: 1

jobs:
  native-fingerprint:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    outputs:
      cache-key: ${{ steps.fingerprint.outputs.cache-key }}
      cache-hit: ${{ steps.fingerprint.outputs.cache-hit }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Node.js
        uses: ./.github/actions/setup-node

      - name: Native fingerprint
        id: fingerprint
        uses: ./.github/actions/native-fingerprint
        with:
          platform: ios
          cache-key-prefix: e2e-ios-${{ hashFiles('.github/workflows/e2e-build-ios.yml') }}

  ios-build:
    needs: native-fingerprint
    if: ${{ !(inputs.seed-only && needs.native-fingerprint.outputs.cache-hit == 'true') }}
    runs-on: macos-26
    permissions:
      contents: read

    env:
      APP_PATH: .native-cache/Rocket.Chat.app

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - parallel:
          - name: Set up Node.js
            uses: ./.github/actions/setup-node

          - name: Restore cached native build
            id: native-cache
            uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
            with:
              path: .native-cache
              key: ${{ needs.native-fingerprint.outputs.cache-key }}

      - name: Set up Xcode
        if: ${{ steps.native-cache.outputs.cache-hit != 'true' }}
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: '26.6'

      - parallel:
          - name: Set up Ruby
            if: ${{ steps.native-cache.outputs.cache-hit != 'true' }}
            uses: ruby/setup-ruby@7372622e62b60b3cb750dcd2b9e32c247ffec26a # v1.302.0
            with:
              ruby-version: 2.7.7
              bundler-cache: true

          - name: Cache CocoaPods
            if: ${{ steps.native-cache.outputs.cache-hit != 'true' }}
            uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
            with:
              path: |
                ios/Pods
                ~/Library/Caches/CocoaPods
                ~/.cocoapods/repos
              key: ios-cache-${{ runner.os }}-${{ hashFiles('ios/Podfile.lock', 'ios/Podfile') }}
              restore-keys: |
                ios-cache-${{ runner.os }}-

      - name: pod install
        if: ${{ steps.native-cache.outputs.cache-hit != 'true' }}
        run: |
          pnpm pod-install

      - name: Set bugsnag key
        if: ${{ steps.native-cache.outputs.cache-hit != 'true' }}
        run: |
          cd ios
          /usr/libexec/PlistBuddy -c "Set :bugsnag:apiKey ${{ secrets.BUGSNAG_KEY}}" ./RocketChatRN/Info.plist
          /usr/libexec/PlistBuddy -c "Set :bugsnag:apiKey ${{ secrets.BUGSNAG_KEY}}" ./ShareRocketChatRN/Info.plist

      - name: Build native iOS app
        if: ${{ steps.native-cache.outputs.cache-hit != 'true' }}
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -workspace RocketChat.xcworkspace \
            -scheme RocketChat \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/derived-data" \
            ARCHS=arm64 \
            DEBUG_INFORMATION_FORMAT=dwarf \
            COMPILER_INDEX_STORE_ENABLE=NO \
            SKIP_BUNDLING=1 \
            build | xcbeautify --renderer github-actions

      - name: Prepare native build for cache
        if: ${{ steps.native-cache.outputs.cache-hit != 'true' }}
        run: |
          mkdir -p "$(dirname "$APP_PATH")"
          ditto "$RUNNER_TEMP/derived-data/Build/Products/Release-iphonesimulator/Rocket.Chat.app" "$APP_PATH"

      - name: Save native build to cache
        if: ${{ steps.native-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .native-cache
          key: ${{ needs.native-fingerprint.outputs.cache-key }}

      - name: Bundle JS into app
        if: ${{ !inputs.seed-only }}
        run: .github/scripts/bundle-ios-app.sh "$APP_PATH"

      - name: Upload Artifact
        if: ${{ !inputs.seed-only }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ios-simulator-app
          path: ${{ env.APP_PATH }}
