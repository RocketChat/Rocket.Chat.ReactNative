name: Build Develop

permissions:
  contents: read

on:
  push:
    branches:
      - 'develop'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-eslint-and-test:
    name: ESLint and Test
    if: ${{ github.repository == 'RocketChat/Rocket.Chat.ReactNative' }}
    uses: ./.github/workflows/eslint.yml

  generate-changelog:
    name: Generate Release Changelog
    needs: [run-eslint-and-test]
    uses: ./.github/workflows/generate-changelog.yml

  android-build-store:
    name: Build Android
    if: ${{ github.repository == 'RocketChat/Rocket.Chat.ReactNative' }}
    uses: ./.github/workflows/build-android.yml
    needs: [run-eslint-and-test, generate-changelog]
    secrets: inherit
    with:
      trigger: develop

  ios-build-store:
    name: Build iOS
    if: ${{ github.repository == 'RocketChat/Rocket.Chat.ReactNative' }}
    uses: ./.github/workflows/build-ios.yml
    needs: [run-eslint-and-test, generate-changelog]
    secrets: inherit
    with:
      trigger: develop

  # The single cross-PR writer of the AVD snapshot + SDK package caches. GitHub
  # scopes PR-written caches to the PR merge ref, so a per-PR seed is invisible
  # to other PRs; a develop-branch cache IS restorable by every PR. Keys are
  # branch-independent and identical to maestro-android.yml's restore step, so
  # PRs read this snapshot read-only. On a miss a PR shard cold-boots instead.
  seed-android-avd:
    name: Seed Android AVD Cache
    if: ${{ github.repository == 'RocketChat/Rocket.Chat.ReactNative' }}
    runs-on: ubuntu-latest
    env:
      ANDROID_AVD_HOME: /home/runner/.android/avd
    steps:
      - name: Checkout Repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Java
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Android AVD
        id: avd-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ runner.os }}-api34

      # The emulator binary and the api-34 system image are NOT in the AVD cache
      # above (that only holds the AVD instance under ~/.android/avd). Cache them
      # separately so PR shards restore them instead of each pulling ~1 GB from
      # dl.google.com — the concurrent re-downloads trigger the random "Error on
      # ZipFile unknown archive" failures.
      - name: Cache Android SDK packages (emulator + system image)
        id: sdk-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            /usr/local/lib/android/sdk/emulator
            /usr/local/lib/android/sdk/system-images/android-34/google_apis/x86_64
          key: android-sdk-emu-${{ runner.os }}-api34

      # Single serialized, retried download so a corrupt/truncated archive
      # self-heals. Runs before the snapshot step below so android-emulator-runner's
      # own sdkmanager install finds the packages already present (a no-op).
      - name: Pre-install Android SDK packages (cache miss only)
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/preinstall-android-sdk

      - name: Enable KVM group permissions
        if: steps.avd-cache.outputs.cache-hit != 'true'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Generate AVD snapshot (cache miss only)
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@e89f39f1abbbd05b1113a29cf4db69e7540cae5a # v2.37.0
        timeout-minutes: 45
        with:
          api-level: 34
          disk-size: 4096M
          arch: x86_64
          target: google_apis
          profile: pixel_7_pro
          cores: 4
          ram-size: 6144M
          force-avd-creation: true
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -accel on
          script: echo "AVD snapshot generated for cache"
