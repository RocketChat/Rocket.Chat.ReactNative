name: Build Android And Upload

on:
  workflow_call:
    inputs:
      trigger:
        type: string
        required: false
        default: pr

permissions: {}

jobs:
  build-hold:
    name: Hold
    runs-on: ubuntu-latest
    permissions: {}
    if: ${{ inputs.trigger == 'pr' }}
    environment: android_build
    steps:
      - run: echo "Waiting for manual approval..."

  build-android:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: build-hold
    if: ${{ always() && (needs.build-hold.result == 'success' || needs.build-hold.result == 'skipped') }}
    outputs:
      BUILD_VERSION: ${{ steps.version.outputs.BUILD_VERSION }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Checkout and Setup Node
        uses: ./.github/actions/setup-node

      - name: Fetch supported versions from Cloud
        uses: ./.github/actions/fetch-supported-versions
        with:
          build_name: 'android'

      - name: Generate Build Version
        id: version
        uses: ./.github/actions/generate-build-version
        with:
          RN_VARIABLES_PAT: ${{ secrets.RN_VARIABLES_PAT }}

      - name: Build Android
        uses: ./.github/actions/build-android
        timeout-minutes: 60
        with:
          GOOGLE_SERVICES_ANDROID: ${{ secrets.GOOGLE_SERVICES_ANDROID }}
          KEYSTORE_OFFICIAL_BASE64: ${{ secrets.KEYSTORE_OFFICIAL_BASE64 }}
          KEYSTORE_OFFICIAL: ${{ secrets.KEYSTORE_OFFICIAL }}
          KEYSTORE_OFFICIAL_PASSWORD: ${{ secrets.KEYSTORE_OFFICIAL_PASSWORD }}
          KEYSTORE_OFFICIAL_ALIAS: ${{ secrets.KEYSTORE_OFFICIAL_ALIAS }}
          BUGSNAG_KEY_OFFICIAL: ${{ secrets.BUGSNAG_KEY_OFFICIAL }}
          BUILD_VERSION: ${{ steps.version.outputs.BUILD_VERSION }}

  upload-android:
    name: Upload
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [build-android]
    if: ${{ always() && inputs.trigger == 'develop' && needs.build-android.result == 'success' }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Upload Android
        uses: ./.github/actions/upload-android
        with:
          trigger: ${{ inputs.trigger }}
          FASTLANE_GOOGLE_SERVICE_ACCOUNT: ${{ secrets.FASTLANE_GOOGLE_SERVICE_ACCOUNT }}
          BUILD_VERSION: ${{ needs.build-android.outputs.BUILD_VERSION }}

  open-testing:
    name: Open Testing
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment: open_testing_android
    needs: [build-android]
    if: ${{ always() && inputs.trigger == 'pr' && needs.build-android.result == 'success' }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Upload to Open Testing
        uses: ./.github/actions/upload-android
        with:
          trigger: ${{ inputs.trigger }}
          FASTLANE_GOOGLE_SERVICE_ACCOUNT: ${{ secrets.FASTLANE_GOOGLE_SERVICE_ACCOUNT }}
          BUILD_VERSION: ${{ needs.build-android.outputs.BUILD_VERSION }}

  production:
    name: Production
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment: production_android
    needs: [build-android, upload-android, open-testing]
    if: ${{ always() && (needs.upload-android.result == 'success' || needs.open-testing.result == 'success') }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Promote to Production
        uses: ./.github/actions/production-android
        with:
          FASTLANE_GOOGLE_SERVICE_ACCOUNT: ${{ secrets.FASTLANE_GOOGLE_SERVICE_ACCOUNT }}
          BUILD_VERSION: ${{ needs.build-android.outputs.BUILD_VERSION }}

  upload-internal:
    name: Internal Sharing
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    needs: [build-android]
    if: ${{ inputs.trigger == 'pr' }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Checkout and Setup Node
        uses: ./.github/actions/setup-node

      - name: Upload Internal Sharing
        uses: ./.github/actions/upload-internal-android
        with:
          FASTLANE_GOOGLE_SERVICE_ACCOUNT: ${{ secrets.FASTLANE_GOOGLE_SERVICE_ACCOUNT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_VERSION: ${{ needs.build-android.outputs.BUILD_VERSION }}
