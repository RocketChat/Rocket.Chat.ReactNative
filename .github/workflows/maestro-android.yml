name: Maestro Tests on Android

on:
  workflow_call:
    inputs:
      shard:
        required: true
        type: string

jobs:
  android-test:
    name: 'Android Tests'
    runs-on: ubuntu-latest
    # Slowest passing shard ~27 min; bounds a wedged session above the in-script
    # timeout -k wrap so a hang fails the job instead of burning the full 6h cap.
    timeout-minutes: 40
    env:
      # 2.5.0 switched gRPC to dadb direct ADB socket — eliminates flaky TCP forwarding (Broken pipe at install).
      # https://github.com/mobile-dev-inc/maestro/releases/tag/cli-2.5.0
      MAESTRO_VERSION: 2.5.1
      ANDROID_AVD_HOME: /home/runner/.android/avd

    steps:
      - name: Checkout Repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Java
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: 17

      # Restore-only: build-develop.yml's seed-android-avd job is the SINGLE
      # writer of this AVD snapshot. GitHub scopes a PR-written cache to that
      # PR's merge ref, so a per-PR writer can't be shared across PRs; a
      # develop-branch cache is restorable by every PR. Shards never save it, so
      # 13 shards × N open PRs no longer each persist a ~3 GB AVD under this key
      # — that per-PR duplication pushed the repo past the 10 GB Actions cache
      # cap and LRU-evicted the SDK system-image cache, forcing cold-boot
      # re-downloads (the "Error on ZipFile unknown archive" shard failures). On
      # a miss (develop hasn't seeded this key yet, or it was evicted) the shard
      # cold-boots below. Shard 14 builds its own keyboard AVD, so skip.
      - name: Restore Android AVD
        if: ${{ inputs.shard != '14' }}
        id: avd-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ runner.os }}-api34

      # Restore the emulator + api-34 system image written on develop by
      # build-develop.yml's seed-android-avd job. With these present,
      # android-emulator-runner's internal sdkmanager install (and shard 14's
      # keyboard-AVD script) become a no-op, so the shards no longer each
      # re-download ~1 GB from dl.google.com — the source of the random "unknown
      # archive" shard failures. Restore-only: develop is the single writer, so
      # the shards never race to save it. On a miss the preinstall step below
      # backfills. Applies to all shards, including 14 (same system image).
      - name: Restore Android SDK packages (emulator + system image)
        id: sdk-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            /usr/local/lib/android/sdk/emulator
            /usr/local/lib/android/sdk/system-images/android-34/google_apis/x86_64
          key: android-sdk-emu-${{ runner.os }}-api34

      # Fix A — safety net for SDK-cache misses (eviction, first run, key bump).
      # android-emulator-runner's internal sdkmanager install AND shard 14's
      # keyboard-AVD create both download the system image in a SINGLE attempt
      # with no retry, so a truncated/corrupt archive fails the shard outright
      # ("Error on ZipFile unknown archive"). The composite action does a
      # serialized, 3× retried install that clears partial downloads between
      # tries. Runs before any emulator boot, so on a cache hit it is a no-op.
      - name: Pre-install Android SDK packages (cache miss only)
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/preinstall-android-sdk

      # Restore-only: e2e-build-android.yml is the single writer of this key, and
      # the shards need that build, so the cache is always populated before this
      # runs — every shard hits and only restores (no save → no first-writer
      # race). The Install Maestro step below stays as a fallback for the rare
      # miss (version drift between the two workflows, or eviction).
      # Cache only the Maestro install dirs — never run data. A later step greps
      # ~/.maestro/tests for SERVER_ERR to classify server-flake vs real
      # regression; caching tests/ + run logs would restore another shard's stale
      # logs and mislabel a genuine failure as a flake.
      - name: Restore Maestro cache
        id: cache-maestro
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.maestro/bin
            ~/.maestro/lib
            ~/.maestro/deps
          key: maestro-${{ runner.os }}-${{ env.MAESTRO_VERSION }}

      - name: Download APK
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: Android APK

      - name: Setup E2E Account
        uses: ./.github/actions/e2e-account
        with:
          E2E_ACCOUNT: ${{ secrets.E2E_ACCOUNT }}

      - name: Install Maestro
        # Gate on cache miss: the install script wipes and re-downloads ~/.maestro
        # on every run (no "already installed" check), so without this guard the
        # Cache Maestro restore above is overwritten and wasted (~70s/shard).
        if: steps.cache-maestro.outputs.cache-hit != 'true'
        run: curl -Ls "https://get.maestro.mobile.dev" | bash

      - name: Add Maestro to PATH
        run: echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Disable unnecessary services (improves emulator stability)
        run: |
          sudo systemctl stop docker || true
          sudo systemctl stop snapd || true

      - name: Make Maestro script executable
        run: chmod +x .github/scripts/run-maestro.sh

      - name: Create Keyboard-enabled AVD (shard 14)
        if: ${{ inputs.shard == '14' }}
        run: |
          set -eux

          ANDROID_SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$ANDROID_SDK/cmdline-tools/latest/bin/sdkmanager"
          AVDMANAGER="$ANDROID_SDK/cmdline-tools/latest/bin/avdmanager"
          AVD_NAME="Pixel_API_34_Keyboard"
          IMAGE="system-images;android-34;google_apis;x86_64"
          AVD_BASE="$ANDROID_AVD_HOME"
          AVD_INI="$AVD_BASE/${AVD_NAME}.ini"

          mkdir -p "$AVD_BASE"
          rm -rf "$AVD_BASE/${AVD_NAME}.avd" "$AVD_INI"

          "$SDKMANAGER" --install emulator "$IMAGE"
          yes | "$SDKMANAGER" --licenses > /dev/null || true

          echo "no" | "$AVDMANAGER" create avd -n "$AVD_NAME" -d pixel_7_pro --package "$IMAGE" --force

          if [ ! -f "$AVD_INI" ]; then
            echo "Expected AVD ini not found: $AVD_INI"
            echo "--- avdmanager list avd ---"
            "$AVDMANAGER" list avd || true
            echo "--- ls AVD_BASE ---"
            ls -la "$AVD_BASE" || true
            exit 1
          fi

          AVD_PATH="$(sed -n 's/^path=//p' "$AVD_INI")"
          if [ -z "$AVD_PATH" ]; then
            echo "Could not resolve AVD path from: $AVD_INI"
            cat "$AVD_INI"
            exit 1
          fi

          AVD_CONFIG="$AVD_PATH/config.ini"
          if [ ! -f "$AVD_CONFIG" ]; then
            echo "Expected AVD config not found: $AVD_CONFIG"
            ls -la "$AVD_BASE" || true
            ls -la "$AVD_PATH" || true
            exit 1
          fi

          {
            echo "hw.keyboard=yes"
            echo "hw.keyboard.lid=no"
            echo "hw.lcd.density=440"
            echo "hw.lcd.height=2280"
            echo "hw.lcd.width=1080"
          } >> "$AVD_CONFIG"

          echo "$AVD_NAME created with physical keyboard support"

      - name: Start Android Emulator and Run Maestro Tests (keyboard AVD)
        if: ${{ inputs.shard == '14' }}
        uses: reactivecircus/android-emulator-runner@e89f39f1abbbd05b1113a29cf4db69e7540cae5a # v2.37.0
        timeout-minutes: 60
        with:
          api-level: 34
          disk-size: 4096M
          arch: x86_64
          target: google_apis
          avd-name: Pixel_API_34_Keyboard
          cores: 4
          ram-size: 6144M
          force-avd-creation: false
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -accel on
          script: ./.github/scripts/run-maestro.sh android ${{ inputs.shard }}

      # No per-shard AVD snapshot generation and no save: the avd-<os>-api34
      # cache is written only on develop (build-develop.yml's seed-android-avd),
      # never by a PR. When the "Restore Android AVD" step hits, the emulator
      # boots from that snapshot; on a miss (develop hasn't seeded this key yet,
      # or it was evicted) android-emulator-runner creates the AVD and cold-boots
      # on the fly. -no-snapshot-save keeps the shard from persisting its own
      # copy, so PRs stay restore-only.
      - name: Start Android Emulator and Run Maestro Tests (default)
        if: ${{ inputs.shard != '14' }}
        uses: reactivecircus/android-emulator-runner@e89f39f1abbbd05b1113a29cf4db69e7540cae5a # v2.37.0
        timeout-minutes: 60
        with:
          api-level: 34
          disk-size: 4096M
          arch: x86_64
          target: google_apis
          profile: pixel_7_pro
          cores: 4
          ram-size: 6144M
          force-avd-creation: false
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -accel on
          script: ./.github/scripts/run-maestro.sh android ${{ inputs.shard }}

      - name: Android Maestro Logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Android Maestro Logs - Shard ${{ inputs.shard }}
          path: |
            ~/.maestro/tests/**/*
            maestro-report.xml
            maestro-rerun-round-*.xml
          retention-days: 7
