name: Maestro Tests on iOS

on:
  workflow_call:
    inputs:
      shard:
        required: true
        type: string

jobs:
  ios-test:
    runs-on: macos-26
    env:
      # Pinned alongside the Android workflow so both platforms run the same
      # Maestro CLI. See cli-2.5.1 release notes for driver improvements.
      # https://github.com/mobile-dev-inc/maestro/releases/tag/cli-2.5.1
      MAESTRO_VERSION: 2.5.1

    steps:
      - name: Checkout Repo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Xcode
        # Match e2e-build-ios.yml so the artifact built against the iOS 26 SDK
        # is exercised on an iOS 26 simulator runtime (avoids SDK/runtime drift).
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: '26.2.0'

      - name: Configure Simulator
        run: |
          defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool false
          defaults write com.apple.iphonesimulator SlowAnimations -bool false
          defaults write com.apple.iphonesimulator ShowDeviceBezels -bool false
          defaults write com.apple.iphonesimulator DisableShadows -bool true
          defaults write com.apple.iphonesimulator AllowFullscreenMode -bool false
          defaults write com.apple.iphonesimulator PasteboardAutomaticSync -bool false
          defaults write com.apple.iphonesimulator ShowChrome -bool false
          defaults write com.apple.iphonesimulator DeviceFramebufferOnly -bool true

      # Kick off the cold boot asynchronously, as early as possible, so the iOS
      # runtime boots in the background while the remaining setup steps (Java,
      # app download, E2E account, Maestro cache/install) run. We block on it
      # afterwards in "Wait for Simulator Ready".
      - name: Start Simulator Boot
        run: |
          # macos-26 catalogs different iPhone names per Xcode release; pick the
          # highest-numbered "iPhone N Pro" present in the installed runtimes
          # so we are not pinned to a name that disappears on image rotation.
          SIM_NAME=$(xcrun simctl list devices available --json \
            | jq -r '[.devices | to_entries[] | .value[] | select(.name | test("^iPhone [0-9]+ Pro$"))] | sort_by(.name | capture("(?<n>[0-9]+)").n | tonumber) | last | .name')

          if [[ -z "$SIM_NAME" || "$SIM_NAME" == "null" ]]; then
            echo "::error::No iPhone N Pro simulator available"
            xcrun simctl list devices available
            exit 1
          fi

          echo "Starting boot for simulator: $SIM_NAME"
          echo "SIM_NAME=$SIM_NAME" >> "$GITHUB_ENV"

          xcrun simctl boot "$SIM_NAME" || true

      - name: Setup Java
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Download App
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ios-simulator-app
          path: ios-simulator-app

      - name: Setup E2E Account
        uses: ./.github/actions/e2e-account
        with:
          E2E_ACCOUNT: ${{ secrets.E2E_ACCOUNT }}

      - name: Cache Maestro
        id: cache-maestro
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.maestro
          key: maestro-${{ runner.os }}-${{ env.MAESTRO_VERSION }}

      # idb-companion is intentionally not installed: Maestro's iOS driver has
      # used XCUITest since 1.18.0 and no longer needs idb to drive the simulator
      # (verified on Maestro 2.5.1 + iOS 26 — launch, tap, hierarchy read and
      # screenshot all work with idb absent). Dropping the `brew tap facebook/fb`
      # + idb install removes ~110s/shard — the tap triggers a full Homebrew
      # auto-update. MAESTRO_VERSION is read from the job env to pin the release.
      - name: Install Maestro
        # The install script wipes and re-downloads ~/.maestro on every run (it
        # has no "already installed" check), so gate it on a cache miss —
        # otherwise the Cache Maestro restore above is overwritten and wasted.
        if: steps.cache-maestro.outputs.cache-hit != 'true'
        run: curl -fsSL "https://get.maestro.mobile.dev" | bash

      - name: Add Maestro to PATH
        run: echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Wait for Simulator Ready
        timeout-minutes: 15
        run: |
          echo "Waiting for simulator to finish booting: $SIM_NAME"
          xcrun simctl bootstatus "$SIM_NAME" -b

          # Collapse UIKit/CoreAnimation transition durations toward zero so
          # React Navigation native-stack transitions finish near-instantly and
          # Maestro never waits on (or acts mid-) a transition. Read once at app
          # launch. iOS analogue of Android's disable-animations.
          # NOTE: this is a duration MULTIPLIER, not an on/off flag — values > 1
          # SLOW animations down. The previous value of 10 made every transition
          # 10x slower (the opposite of the "Disabling animations" intent).
          echo "Disabling animations"
          xcrun simctl spawn booted defaults write -g UIAnimationDragCoefficient -float 0.0001

          echo "Booted devices:"
          xcrun simctl list devices | grep Booted

      - name: Install App
        run: |
          xcrun simctl install booted ios-simulator-app

      - name: Make Maestro Script Executable
        run: chmod +x .github/scripts/run-maestro.sh

      - name: Run Maestro Tests
        # Slowest passing shard is ~27 min; with up to 2 internal rerun rounds
        # we need headroom above that. nick-fields/retry previously gave 60 min
        # (2 × 30); 45 min is a closer single-step equivalent without overshoot.
        timeout-minutes: 45
        run: ./.github/scripts/run-maestro.sh ios ${{ inputs.shard }}

      - name: Upload Maestro Logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: iOS Maestro Logs - Shard ${{ inputs.shard }}
          path: |
            ~/.maestro/tests/**/*
            maestro-report.xml
            maestro-rerun-round-*.xml
          retention-days: 7
