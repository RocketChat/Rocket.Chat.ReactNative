name: Maestro Tests on iOS

on:
  workflow_call:
    inputs:
      shard:
        required: true
        type: string

jobs:
  ios-test:
    runs-on: macos-14
    env:
      MAESTRO_VERSION: 2.2.0

    steps:
      - name: Checkout Repo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Java
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Download App
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ios-simulator-app
          path: ios-simulator-app

      - name: Setup E2E Account
        uses: ./.github/actions/e2e-account
        with:
          E2E_ACCOUNT: ${{ secrets.E2E_ACCOUNT }}

      - name: Cache Maestro
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.maestro
          key: maestro-${{ runner.os }}-${{ env.MAESTRO_VERSION }}

      - name: Configure Simulator
        run: |
          defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool false
          defaults write com.apple.iphonesimulator SlowAnimations -bool false
          defaults write com.apple.iphonesimulator ShowDeviceBezels -bool false
          defaults write com.apple.iphonesimulator DisableShadows -bool true
          defaults write com.apple.iphonesimulator AllowFullscreenMode -bool false
          defaults write com.apple.iphonesimulator PasteboardAutomaticSync -bool false
          defaults write com.apple.iphonesimulator ShowChrome -bool false
          defaults write com.apple.iphonesimulator DeviceFramebufferOnly -bool true

      # Kick off the cold boot asynchronously so the iOS runtime boots in the
      # background while Maestro + idb install. We block on it afterwards in
      # "Wait for Simulator Ready".
      - name: Start Simulator Boot
        run: |
          if [ "${{ inputs.shard }}" = "14" ]; then
            SIM_NAME="iPhone SE (3rd generation)"
          else
            SIM_NAME="iPhone 16 Pro"
          fi
          echo "SIM_NAME=$SIM_NAME" >> "$GITHUB_ENV"

          echo "Starting boot for simulator: $SIM_NAME"
          xcrun simctl boot "$SIM_NAME" || true

      - name: Install Maestro + idb
        run: |
          brew tap facebook/fb
          brew install facebook/fb/idb-companion
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Wait for Simulator Ready
        timeout-minutes: 15
        run: |
          echo "Waiting for simulator to finish booting: $SIM_NAME"
          xcrun simctl bootstatus "$SIM_NAME" -b

          echo "Disabling animations"
          xcrun simctl spawn booted defaults write -g UIAnimationDragCoefficient -float 10

          echo "Warming SpringBoard"
          xcrun simctl launch booted com.apple.springboard
          sleep 5

          echo "Booted devices:"
          xcrun simctl list devices | grep Booted

      - name: Get Booted Simulator UDID
        id: booted-sim
        run: |
          UDID=$(xcrun simctl list devices booted | grep -oE '[A-F0-9-]{36}' | head -n1)
          echo "UDID=$UDID"
          echo "UDID=$UDID" >> $GITHUB_ENV

      - name: Install App
        run: |
          xcrun simctl install booted ios-simulator-app

      - name: Make Maestro Script Executable
        run: chmod +x .github/scripts/run-maestro.sh

      # Installs Maestro's XCTest driver onto the booted simulator (~3min on a
      # cold sim) so the timed step below measures test execution only.
      - name: Warm Up Maestro Driver
        timeout-minutes: 6
        run: |
          cat > /tmp/maestro-warmup.yaml <<'EOF'
          appId: com.apple.Preferences
          ---
          - launchApp
          EOF
          maestro test /tmp/maestro-warmup.yaml || true

      - name: Run Maestro Tests
        timeout-minutes: 30
        run: ./.github/scripts/run-maestro.sh ios ${{ inputs.shard }}

      - name: Upload Maestro Logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: iOS Maestro Logs - Shard ${{ inputs.shard }}
          path: ~/.maestro/tests/**/*.png
          retention-days: 7
