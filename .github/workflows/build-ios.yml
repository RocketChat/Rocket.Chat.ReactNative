name: Build iOS And Upload

on:
  workflow_call:
    inputs:
      trigger:
        type: string
        required: false
        default: pr

permissions: {}

jobs:
  build-hold:
    name: Hold
    runs-on: ubuntu-latest
    permissions: {}
    if: ${{ inputs.trigger == 'pr' }}
    environment: ios_build
    steps:
      - run: echo "Waiting for manual approval..."

  build-ios:
    name: Build
    runs-on: macos-26
    permissions:
      contents: read
    needs: [build-hold]
    if: ${{ always() && (needs.build-hold.result == 'success' || needs.build-hold.result == 'skipped') }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: '26.6'

      - parallel:
          - name: Checkout and Setup Node
            uses: ./.github/actions/setup-node

          - name: Remove simulator and its cache
            run: |
              xcrun simctl delete all
              sudo rm -rf ~/Library/Developer/CoreSimulator/Caches/*

          - name: Set up Ruby
            uses: ruby/setup-ruby@7372622e62b60b3cb750dcd2b9e32c247ffec26a # v1.302.0
            with:
              ruby-version: 2.7.7
              bundler-cache: true

          - name: Pod Cache
            uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
            with:
              path: |
                ~/.pods
                ios/Pods
              key: pods-v2-${{ hashFiles('ios/Podfile.lock') }}
              restore-keys: |
                pods-v2-

      - name: Fetch supported versions from Cloud
        uses: ./.github/actions/fetch-supported-versions
        with:
          build_name: 'ios'

      - name: Generate Build Version
        id: version
        uses: ./.github/actions/generate-build-version
        with:
          RN_VARIABLES_PAT: ${{ secrets.RN_VARIABLES_PAT }}

      - name: Build iOS
        uses: ./.github/actions/build-ios
        timeout-minutes: 60
        with:
          MATCH_KEYCHAIN_NAME: ${{ secrets.MATCH_KEYCHAIN_NAME }}
          MATCH_KEYCHAIN_PASSWORD: ${{ secrets.MATCH_KEYCHAIN_PASSWORD }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          FASTLANE_REPO_PAT: ${{ secrets.FASTLANE_REPO_PAT }}
          BUGSNAG_KEY_OFFICIAL: ${{ secrets.BUGSNAG_KEY_OFFICIAL }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          GOOGLE_SERVICES_IOS: ${{ secrets.GOOGLE_SERVICES_IOS }}
          BUILD_VERSION: ${{ steps.version.outputs.BUILD_VERSION }}

      - parallel:
          - name: Upload IPA artifact
            uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
            with:
              name: ios-build
              path: ios/Rocket.Chat.ipa

          - name: Upload Rocket.Chat.app.dSYM.zip
            uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
            with:
              name: ios-build-dSYM
              path: ios/Rocket.Chat.app.dSYM.zip

          - name: Upload RocketChatRN/Info.plist
            uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
            with:
              name: ios-build-info-plist
              path: ios/RocketChatRN/Info.plist

  upload-ios:
    name: Upload
    runs-on: macos-26
    permissions:
      contents: read
      pull-requests: write
    needs: [build-ios]
    if: ${{ always() && needs.build-ios.result == 'success' }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: '26.6'

      - parallel:
          - name: Setup Node
            uses: ./.github/actions/setup-node

          - name: Download iOS build
            uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
            with:
              name: ios-build
              path: ios/

          - name: Download dSYM
            uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
            with:
              name: ios-build-dSYM
              path: ios/

          - name: Download Info.plist
            uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
            with:
              name: ios-build-info-plist
              path: ios/RocketChatRN/

          - name: Download changelog
            if: ${{ inputs.trigger == 'develop' || inputs.trigger == 'pr' }}
            uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
            with:
              name: release-changelog
              path: .

          - name: Pod Cache
            uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
            with:
              path: |
                ~/.pods
                ios/Pods
              key: pods-v2-${{ hashFiles('ios/Podfile.lock') }}
              restore-keys: |
                pods-v2-

          - name: Set up Ruby
            uses: ruby/setup-ruby@7372622e62b60b3cb750dcd2b9e32c247ffec26a # v1.302.0
            with:
              ruby-version: 2.7.7
              bundler-cache: true

      - name: Upload iOS
        uses: ./.github/actions/upload-ios
        with:
          trigger: ${{ inputs.trigger }}
          MATCH_KEYCHAIN_NAME: ${{ secrets.MATCH_KEYCHAIN_NAME }}
          MATCH_KEYCHAIN_PASSWORD: ${{ secrets.MATCH_KEYCHAIN_PASSWORD }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          FASTLANE_REPO_PAT: ${{ secrets.FASTLANE_REPO_PAT }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
