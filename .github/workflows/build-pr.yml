name: Build PR

permissions:
  contents: read
  pull-requests: write

on:
  pull_request:
    branches:
      - '*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-eslint-and-test:
    name: ESLint and Test
    if: ${{ github.repository == 'RocketChat/Rocket.Chat.ReactNative' }}
    uses: ./.github/workflows/eslint.yml

  android-build-store:
    name: Build Android
    if: ${{ github.repository == 'RocketChat/Rocket.Chat.ReactNative' }}
    uses: ./.github/workflows/build-android.yml
    needs: [run-eslint-and-test]
    secrets: inherit
    with:
      trigger: "pr"

  ios-build-store:
    name: Build iOS
    if: ${{ github.repository == 'RocketChat/Rocket.Chat.ReactNative' }}
    uses: ./.github/workflows/build-ios.yml
    needs: [run-eslint-and-test]
    secrets: inherit
    with:
      trigger: "pr"

  e2e-hold:
    name: E2E Hold
    if: ${{ github.repository == 'RocketChat/Rocket.Chat.ReactNative' }}
    environment: approve_e2e_testing
    runs-on: ubuntu-latest
    steps:
      - run: echo "Waiting for manual approval..."

  e2e-build-android:
    name: E2E Build Android
    if: ${{ github.repository == 'RocketChat/Rocket.Chat.ReactNative' }}
    uses: ./.github/workflows/e2e-build-android.yml
    needs: [e2e-hold]
    secrets: inherit

  # Single source of the shard list both platforms fan out over, and the guard
  # that keeps it honest: it asserts every flow under .maestro/tests is tagged
  # test-<N> within the declared range and every shard in the range has a flow,
  # then emits the list as JSON for the matrices below. A flow tagged outside
  # the range, or a gap in the range, fails here instead of letting that flow
  # silently never run. No AVD seeding happens on PRs — the avd/sdk caches are
  # written only on develop (build-develop.yml's seed-android-avd); shards
  # restore them read-only and cold-boot on a miss.
  e2e-shards:
    name: E2E Shard Preflight
    if: ${{ github.repository == 'RocketChat/Rocket.Chat.ReactNative' }}
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.shards.outputs.shards }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Assert Maestro shard coverage
        id: shards
        run: bash .github/scripts/assert-maestro-shards.sh

  e2e-run-android:
    name: E2E Run Android
    if: ${{ github.repository == 'RocketChat/Rocket.Chat.ReactNative' }}
    uses: ./.github/workflows/maestro-android.yml
    needs: [e2e-build-android, e2e-shards]
    secrets: inherit
    strategy:
      matrix:
        shard: ${{ fromJSON(needs.e2e-shards.outputs.shards) }}
      fail-fast: false
    with:
      shard: ${{ matrix.shard }}

  e2e-build-ios:
    name: E2E Build iOS
    if: ${{ github.repository == 'RocketChat/Rocket.Chat.ReactNative' }}
    uses: ./.github/workflows/e2e-build-ios.yml
    needs: [e2e-hold]
    secrets: inherit

  e2e-run-ios:
    name: E2E Run iOS
    if: ${{ github.repository == 'RocketChat/Rocket.Chat.ReactNative' }}
    uses: ./.github/workflows/maestro-ios.yml
    needs: [e2e-build-ios, e2e-shards]
    secrets: inherit
    strategy:
      matrix:
        shard: ${{ fromJSON(needs.e2e-shards.outputs.shards) }}
      fail-fast: false
    with:
      shard: ${{ matrix.shard }}
