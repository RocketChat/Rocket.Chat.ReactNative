name: Visual Regression Run Android

# Reusable: runs one Android visual-regression leg against a pre-built Owl APK.
# Downloads the APK, syncs the matching baseline prints from the reference repo,
# then boots a Pixel 7 Pro emulator and compares. owl test installs the APK and
# launches it itself inside the emulator-runner step.

on:
  workflow_call:
    inputs:
      variant:
        description: 'OWL_VARIANT, e.g. android-portrait'
        required: true
        type: string
      update_baseline:
        description: 'Capture fresh baselines instead of comparing'
        required: false
        type: boolean
        default: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      USE_OWL: true
      RUNNING_E2E_TESTS: true
      OWL_VARIANT: ${{ inputs.variant }}
      UPDATE_BASELINE: ${{ inputs.update_baseline }}
      ANDROID_AVD_HOME: /home/runner/.android/avd
      BASELINE_REPO: https://github.com/OtavioStasiak/Rocket.Chat.ReactNative.VisualRegressionTest

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Checkout and Setup Node
        uses: ./.github/actions/setup-node

      - name: Setup Java
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Android AVD
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ runner.os }}-api34

      # owl test installs <cwd>/android/app/build/outputs/apk/release/app-release.apk
      - name: Download Owl APK
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: owl-app-android
          path: android/app/build/outputs/apk/release

      - name: Sync baseline prints from reference repo (compare mode)
        if: ${{ !inputs.update_baseline }}
        run: |
          set -euo pipefail
          git clone --depth=1 --quiet "$BASELINE_REPO" .owl/reference
          rm -rf .owl/baseline/android
          mkdir -p .owl/baseline/android
          cp .owl/reference/app/containers/ActionSheet/"$OWL_VARIANT"-*.png .owl/baseline/android/
          echo "Staged $(ls .owl/baseline/android | wc -l) baseline print(s) for $OWL_VARIANT"

      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Disable unnecessary services (improves emulator stability)
        run: |
          sudo systemctl stop docker || true
          sudo systemctl stop snapd || true

      - name: Boot emulator and run Owl
        uses: reactivecircus/android-emulator-runner@e89f39f1abbbd05b1113a29cf4db69e7540cae5a # v2.37.0
        timeout-minutes: 45
        with:
          api-level: 34
          disk-size: 4096M
          arch: x86_64
          target: google_apis
          profile: pixel_7_pro
          cores: 4
          ram-size: 4096M
          force-avd-creation: false
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -accel on
          script: |
            if [ "$UPDATE_BASELINE" = "true" ]; then
              pnpm owl:test:update:android
            else
              pnpm owl:test:android
            fi

      # Clean, commit-ready prints: just the PNGs, correctly named. Download all
      # legs' owl-baseline-* artifacts and drop them into the reference repo's
      # app/containers/ActionSheet/ to seed the CI goldens.
      - name: Upload fresh baselines (update mode)
        if: ${{ inputs.update_baseline }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: owl-baseline-${{ inputs.variant }}
          path: .owl/baseline/android/*.png
          if-no-files-found: error

      - name: Upload Owl results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: owl-android-${{ inputs.variant }}
          path: |
            .owl/report
            .owl/diff
            .owl/latest
            .owl/baseline/android
          retention-days: 7
